<!DOCTYPE html>
<html lang="it">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gesù è vivo e cammina insieme a noi.</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Caricamento configurazione e dati -->
  <script src="contenuti.js"></script>

  <style>
    :root {
      --bg-color: #F8F5F0;
      --card-bg: #FFFFFF;
      --accent-terracotta: #C05A3E;
      --text-main: #2C2623;
      --text-muted: #8C827A;
      --border-color: #E6E0D6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 85px;
    }

    /* TOP BAR */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background-color: var(--bg-color);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .top-bar-logo {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .top-bar-title {
      font-family: 'Playfair Display', serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--accent-terracotta);
      text-align: center;
    }

    header {
      padding: 20px 20px 10px;
      text-align: center;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      line-height: 1.3;
      color: #2C2623;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    header .author {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 15px;
      color: var(--accent-terracotta);
      margin-top: 6px;
      font-weight: 400;
    }
    .cross-icon {
      color: var(--accent-terracotta);
      font-size: 13px;
      margin: 8px 0 10px;
    }
    .badge {
      display: inline-block;
      background-color: var(--accent-terracotta);
      color: white;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .content-section { display: none; padding: 15px 15px 20px; }
    .content-section.active { display: block !important; }

    .link-card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
      border: 1px solid var(--border-color);
      margin-top: 10px;
    }
    .card-img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      margin-bottom: 18px;
    }
    .link-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: #2C2623;
      margin-bottom: 8px;
    }

    /* CONTROLLI FONT (A- / A+) */
    .font-controls {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 15px;
    }
    .font-btn {
      padding: 6px 14px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid var(--accent-terracotta);
      background: var(--card-bg);
      color: var(--accent-terracotta);
      cursor: pointer;
    }

    /* TESTO DELLA LITURGIA */
    .liturgia-testo {
      font-size: 16px;
      line-height: 1.7;
      color: var(--text-main);
      text-align: left;
      white-space: pre-wrap;
    }

    /* AUDIO PLAYER */
    .audio-player-box {
      margin-bottom: 20px;
      padding: 15px;
      background: #FAF8F5;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      text-align: center;
    }
    audio { width: 100%; max-width: 400px; }

    /* BOTTOM NAVIGATION BAR */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 1000;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    .nav-item.active { color: var(--accent-terracotta); }
    .nav-item i { font-size: 18px; }
  </style>
</head>
<body>

<div class="app-container">
  
  <!-- TOP BAR -->
  <div class="top-bar">
    <img src="logo.png" id="app-logo" class="top-bar-logo" alt="Logo">
    <div class="top-bar-title">CSCV</div>
    <img src="logo.png" class="top-bar-logo" style="opacity:0;" alt="">
  </div>

  <header>
    <h1>Gesù è vivo e cammina insieme a noi.</h1>
    <div class="author">Padre Emiliano Tardif</div>
    <div class="cross-icon"><i class="fa-solid fa-cross"></i></div>
    <div class="badge" id="current-badge">LODI DEL GIORNO</div>
  </header>

  <!-- SEZIONE LODI -->
  <div id="sec-lodi" class="content-section active">
    <div class="link-card">
      <img src="lodi.jpg" class="card-img" alt="Lodi">
      <h2>Lodi Mattutine</h2>
      <div class="font-controls">
        <button class="font-btn" onclick="changeFontSize(-2)">A -</button>
        <button class="font-btn" onclick="changeFontSize(2)">A +</button>
      </div>
      <div id="testo-lodi" class="liturgia-testo">Caricamento delle Lodi in corso...</div>
    </div>
  </div>

  <!-- SEZIONE VESPRI -->
  <div id="sec-vespri" class="content-section">
    <div class="link-card">
      <img src="vespri.jpg" class="card-img" alt="Vespri">
      <h2>Vespri</h2>
      <div class="font-controls">
        <button class="font-btn" onclick="changeFontSize(-2)">A -</button>
        <button class="font-btn" onclick="changeFontSize(2)">A +</button>
      </div>
      <div id="testo-vespri" class="liturgia-testo">Caricamento dei Vespri in corso...</div>
    </div>
  </div>

  <!-- SEZIONE COMPIETA -->
  <div id="sec-compieta" class="content-section">
    <div class="link-card">
      <img src="compieta.jpg" class="card-img" alt="Compieta">
      <h2>Compieta</h2>
      <div class="font-controls">
        <button class="font-btn" onclick="changeFontSize(-2)">A -</button>
        <button class="font-btn" onclick="changeFontSize(2)">A +</button>
      </div>
      <div id="testo-compieta" class="liturgia-testo">Caricamento della Compieta in corso...</div>
    </div>
  </div>

  <!-- SEZIONE LETTURE -->
  <div id="sec-letture" class="content-section">
    <div class="link-card">
      <img src="letture.jpg" class="card-img" alt="Letture">
      <h2>Letture della Messa</h2>
      
      <!-- Lettore Audio Integrato -->
      <div class="audio-player-box">
        <audio id="player-letture" controls>
          <source id="src-audio-letture" src="" type="audio/mpeg">
        </audio>
      </div>

      <div class="font-controls">
        <button class="font-btn" onclick="changeFontSize(-2)">A -</button>
        <button class="font-btn" onclick="changeFontSize(2)">A +</button>
      </div>
      <div id="testo-letture" class="liturgia-testo">Caricamento delle Letture del giorno in corso...</div>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION BAR -->
  <div class="nav-bar">
    <button class="nav-item active" onclick="switchTab('lodi', 'LODI DEL GIORNO')">
      <i class="fa-solid fa-sun"></i>
      <span>LODI</span>
    </button>
    <button class="nav-item" onclick="switchTab('vespri', 'VESPRI DEL GIORNO')">
      <i class="fa-solid fa-moon"></i>
      <span>VESPRI</span>
    </button>
    <button class="nav-item" onclick="switchTab('compieta', 'COMPIETA')">
      <i class="fa-solid fa-bed"></i>
      <span>COMPIETA</span>
    </button>
    <button class="nav-item" onclick="switchTab('letture', 'LETTURE DEL GIORNO')">
      <i class="fa-solid fa-book-open"></i>
      <span>LETTURE</span>
    </button>
  </div>

</div>

<script>
  let currentFontSize = 16;

  // Modifica dimensione carattere (A- / A+)
  function changeFontSize(delta) {
    currentFontSize = Math.min(Math.max(12, currentFontSize + delta), 28);
    const elementi = document.querySelectorAll('.liturgia-testo');
    elementi.forEach(el => el.style.fontSize = currentFontSize + 'px');
  }

  // Cambio scheda nella navigazione
  function switchTab(sezione, badgeText) {
    document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));

    document.getElementById('sec-' + sezione).classList.add('active');
    document.getElementById('current-badge').innerText = badgeText;
  }

  // Caricamento dei testi e dell'audio dal file JSON generato su GitHub Pages
  async function caricaDatiLiturgia() {
    try {
      const res = await fetch('dati/oggi.json');
      if (!res.ok) throw new Error("File JSON non trovato");
      
      const dati = await res.json();

      if (dati.lodi) document.getElementById('testo-lodi').innerHTML = dati.lodi;
      if (dati.vespri) document.getElementById('testo-vespri').innerHTML = dati.vespri;
      if (dati.compieta) document.getElementById('testo-compieta').innerHTML = dati.compieta;
      if (dati.letture) document.getElementById('testo-letture').innerHTML = dati.letture;

      if (dati.audio_url) {
        const player = document.getElementById('player-letture');
        document.getElementById('src-audio-letture').src = dati.audio_url;
        player.load();
      }
    } catch (err) {
      console.warn("Dati in fase di aggiornamento o non ancora presenti:", err);
    }
  }

  // Inizializzazione al caricamento della pagina
  window.addEventListener('DOMContentLoaded', () => {
    caricaDatiLiturgia();
  });
</script>

</body>
</html>
