name: Aggiornamento Automatico Liturgia

on:
  schedule:
    - cron: '0 3,4,5 * * *'
  workflow_dispatch:

jobs:
  update-liturgy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Assicura presenza cartella dati
        run: mkdir -p dati

      - name: Esecuzione script di scraping
        run: |
          python script_liturgia.py

      - name: Commit e Push dei file aggiornati
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dati/oggi.json
          git status
          git diff-index --quiet HEAD || (git commit -m "Automated: Aggiornamento liturgia del giorno" && git push)
