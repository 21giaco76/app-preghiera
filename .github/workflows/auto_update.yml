name: Aggiornamento Automatico Audio Letture

on:
  schedule:
    # Esegue lo script ogni notte alle 03:00 UTC (4:00 o 5:00 ora italiana)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permette anche l'esecuzione manuale con un click

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il repository
      uses: actions/checkout@v3

    - name: Configura Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Esegui lo script di aggiornamento
      run: python aggiorna_audio.py

    - name: Salva e pubblica i cambiamenti su GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add contenuti.js
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update audio del giorno" && git push)
